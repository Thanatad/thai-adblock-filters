name: Build Combined Filter List

on:
  push:
    branches: [ main ]
    paths:
      - 'movie-ads.txt'
      - 'manga-ads.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine filter files
        run: |
          echo "! Title: Thai Combined Ads Filter" > combined.txt
          echo "! Description: Automatically combined filter list" >> combined.txt
          echo "" >> combined.txt
          cat movie-ads.txt manga-ads.txt >> combined.txt

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add combined.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-combine filter lists" && git push)
